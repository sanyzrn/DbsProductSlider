name: Plugin regression checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:vendor && npm run build:translations
      - run: git diff --exit-code -- assets/vendor languages
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-artifacts-php-${{ matrix.php }}
          path: test-results/
